[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent-mcp"
version = "0.1.0"
description = "Freight underwriting agent and MCP business-tool gateway (synthetic proof)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "fastmcp==4.1.6",
    "mcp==2.3.0",
    "PyJWT>=2.8",
    "uvicorn>=0.30",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge_agent_mcp = [
    "console/templates/*.html",
    "console/static/*.css",
    "console/static/*.js",
    "console/static/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
pythonpath = ["src"]
markers = [
    "live: calls a real model provider; excluded from the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
